<div class="h-full w-full px-4 pb-4" [ngClass]="colors">
  <div class="flex h-full flex-col">
    <div>
      <h2 class="my-4 text-xl font-bold text-white">{{ board?.title }}</h2>
    </div>
    <div
      class="flex h-full w-full grow items-start overflow-x-scroll"
      cdkDropListGroup
    >
      <div
        class="mr-3 w-72 shrink-0 rounded bg-gray-200 p-2"
        *ngFor="let list of board?.lists"
      >
        <div class="flex justify-between py-1">
          <h3 class="ml-2 text-sm font-bold">{{ list.title }}</h3>
        </div>

        <div
          class="mt-2 min-h-[2.5rem] text-sm"
          [id]="list.id"
          cdkDropList
          (cdkDropListDropped)="drop($event)"
          [cdkDropListData]="list.cards"
        >
          <div
            (click)="openDialog(card)"
            *ngFor="let card of list.cards"
            cdkDrag
            class="mt-2 cursor-pointer rounded border-b border-x-gray-300 bg-white p-2 shadow hover:bg-gray-400"
          >
            {{ card.title }}
          </div>
        </div>
        <div>
          <app-btn
            color="light"
            *ngIf="!list.showCardForm"
            (click)="openFormCard(list)"
            >Add Card</app-btn
          >
          <div *ngIf="list.showCardForm" class="w-full">
            <textarea
              [formControl]="inputCard"
              class="w-full rounded border-b-2 border-b-gray-400 text-xs"
              placeholder="Enter a title for this card..."
            ></textarea>
            <div class="flex justify-between space-x-2">
              <app-btn color="success" (click)="createCard(list)"
                >Add card</app-btn
              >
              <app-btn color="light" (click)="closeCardForm(list)"
                ><fa-icon [icon]="faClose"></fa-icon
              ></app-btn>
            </div>
          </div>
        </div>
      </div>
      <div class="shrink-0">
        <app-btn
          *ngIf="!showListForm"
          color="light"
          (click)="showListForm = !showListForm"
          >Add another list</app-btn
        >
        <div *ngIf="showListForm" class="w-full">
          <textarea
            [formControl]="inputList"
            class="w-full rounded border-b-2 border-b-gray-400 text-xs"
            placeholder="Enter a title for this card..."
          ></textarea>
          <div class="flex justify-between space-x-2">
            <app-btn color="success" (click)="addList()">Create</app-btn>
            <app-btn color="light" (click)="showListForm = !showListForm"
              ><fa-icon [icon]="faClose"></fa-icon
            ></app-btn>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
